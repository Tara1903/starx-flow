name: CI Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm ci
      - name: Install nested outreach dependencies
        run: npm --prefix ai-outreach/ai-outreach-automation-system install
      - name: Run root TypeScript type check
        run: npm run typecheck
      - name: Run full lint across workspace
        run: npm run lint:all
