name: Process Scheduled Jobs

on:
  schedule:
    # Runs every 5 minutes (Vercel Hobby allows once-daily crons; this handles near-real-time reminders & retries)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger StarX Flow Job Processor
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET secret is not set in GitHub Actions; skipping external 5-min trigger (daily Vercel Cron remains active)."
            exit 0
          fi

          STATUS=$(curl -sS -o /tmp/cron_response.json -w "%{http_code}" \
            -X POST "https://starx-flow.runs-on.dev/api/cron/process-jobs" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          cat /tmp/cron_response.json
          echo ""
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Cron endpoint returned HTTP $STATUS"
            exit 1
          fi
